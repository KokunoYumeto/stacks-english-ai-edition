name: Unified repository validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate unified source, registry, and documentation
        shell: bash
        run: |
          if test "${GITHUB_EVENT_NAME}" = push \
            && test "${GITHUB_REF}" = refs/heads/main \
            && test -f validation/stacks-errata-a04446e-r22-r23-release-2026-08-27.json; then
            python tools/validate_unified_repository.py
          else
            python tools/validate_unified_repository.py --pre-publication
          fi
